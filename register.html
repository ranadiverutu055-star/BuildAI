<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - BuildAI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="login-page">


<div class="login-wrapper">


    <!-- ================================================= -->
    <!-- LEFT SIDE - CONSTRUCTION IMAGE -->
    <!-- ================================================= -->

    <div class="login-visual">

    </div>


    <!-- ================================================= -->
    <!-- RIGHT SIDE - REGISTER FORM -->
    <!-- ================================================= -->

    <div class="login-form-section">


        <div class="login-card">


            <!-- ================= LOGO ================= -->

            <div class="text-center login-header">

                <div class="login-logo">

                    <i class="fa-solid fa-city"></i>

                </div>


                <h2>
                    Build<span>AI</span>
                </h2>


                <p>
                    Construction Cost Prediction System
                </p>

            </div>



            <!-- ================= WELCOME ================= -->

            <div class="welcome-section">

                <h3>
                    Create Your Account
                </h3>

                <p>
                    Register to start using BuildAI.
                </p>

            </div>



            <!-- ================= REGISTER FORM ================= -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="mb-3">

                    <label for="name"
                           class="form-label">

                        Full Name

                    </label>


                    <div class="custom-input">

                        <i class="fa-solid fa-user"></i>


                        <input type="text"
                               id="name"
                               name="name"
                               placeholder="Enter your name"
                               required>

                    </div>

                </div>



                <!-- EMAIL -->

                <div class="mb-3">

                    <label for="email"
                           class="form-label">

                        Email Address

                    </label>


                    <div class="custom-input">

                        <i class="fa-solid fa-envelope"></i>


                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="mb-3">

                    <label for="password"
                           class="form-label">

                        Password

                    </label>


                    <div class="custom-input password-input">

                        <i class="fa-solid fa-lock"></i>


                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Create a password"
                               required>


                        <button type="button"
                                id="togglePassword"
                                class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="mb-3">

                    <label for="confirmPassword"
                           class="form-label">

                        Confirm Password

                    </label>


                    <div class="custom-input password-input">

                        <i class="fa-solid fa-lock"></i>


                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Confirm your password"
                               required>


                        <button type="button"
                                id="toggleConfirmPassword"
                                class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>



                <!-- MESSAGE -->

                <div id="registerMessage"
                     style="display:none; margin-bottom:15px;">
                </div>



                <!-- REGISTER BUTTON -->

                <button type="submit"
                        class="login-button"
                        id="registerButton">

                    <i class="fa-solid fa-user-plus"></i>

                    Create Account

                </button>


            </form>



            <!-- ================= LOGIN LINK ================= -->

            <div class="register-section">

                <p>

                    Already have an account?

                    <a href="/">
                        Login
                    </a>

                </p>

            </div>


        </div>



        <!-- ================= FOOTER ================= -->

        <div class="login-footer">

            <span>
                © 2026 BuildAI
            </span>

            <span>•</span>

            <span>
                Building the future with AI
            </span>

        </div>


    </div>


</div>



<!-- ================================================= -->
<!-- BOOTSTRAP JS -->
<!-- ================================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================================================= -->
<!-- REGISTER JAVASCRIPT -->
<!-- ================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    const registerForm =
        document.getElementById("registerForm");

    const registerButton =
        document.getElementById("registerButton");

    const registerMessage =
        document.getElementById("registerMessage");


    /* =================================================
       PASSWORD SHOW / HIDE
       ================================================= */

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordInput =
        document.getElementById("password");


    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            this.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        } else {

            passwordInput.type = "password";

            this.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    });



    /* =================================================
       CONFIRM PASSWORD SHOW / HIDE
       ================================================= */

    const toggleConfirmPassword =
        document.getElementById("toggleConfirmPassword");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");


    toggleConfirmPassword.addEventListener("click", function () {

        if (confirmPasswordInput.type === "password") {

            confirmPasswordInput.type = "text";

            this.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        } else {

            confirmPasswordInput.type = "password";

            this.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    });



    /* =================================================
       REGISTER
       ================================================= */

    registerForm.addEventListener("submit", async function (event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;



        /* =============================================
           BASIC VALIDATION
           ============================================= */

        if (!name || !email || !password || !confirmPassword) {

            showMessage(
                "Please fill in all fields.",
                "error"
            );

            return;

        }



        /* =============================================
           PASSWORD MATCH
           ============================================= */

        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }



        /* =============================================
           PASSWORD LENGTH
           ============================================= */

        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }



        /* =============================================
           DISABLE BUTTON
           ============================================= */

        registerButton.disabled = true;

        registerButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';



        try {


            const response = await fetch("/register", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                credentials: "include",

                body: JSON.stringify({

                    name: name,

                    email: email,

                    password: password

                })

            });



            const data =
                await response.json();



            /* =========================================
               SUCCESS
               ========================================= */

            if (response.ok && data.success) {


                showMessage(
                    "Account created successfully! Redirecting to login...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href =
                        data.redirect || "/";

                }, 1000);


            }


            /* =========================================
               ERROR
               ========================================= */

            else {


                showMessage(

                    data.error ||
                    "Registration failed.",

                    "error"

                );


                registerButton.disabled = false;


                registerButton.innerHTML =
                    '<i class="fa-solid fa-user-plus"></i> Create Account';

            }


        } catch (error) {


            console.error(
                "Registration Error:",
                error
            );


            showMessage(

                "Unable to connect to the server.",

                "error"

            );


            registerButton.disabled = false;


            registerButton.innerHTML =
                '<i class="fa-solid fa-user-plus"></i> Create Account';

        }

    });



    /* =================================================
       MESSAGE FUNCTION
       ================================================= */

    function showMessage(message, type) {


        registerMessage.style.display =
            "block";


        registerMessage.textContent =
            message;


        registerMessage.style.padding =
            "10px 14px";


        registerMessage.style.borderRadius =
            "8px";


        if (type === "success") {


            registerMessage.style.color =
                "#198754";


            registerMessage.style.background =
                "#e9f7ef";


        } else {


            registerMessage.style.color =
                "#dc3545";


            registerMessage.style.background =
                "#fdecec";

        }

    }

});

</script>



<!-- ================================================= -->
<!-- EXISTING SCRIPT -->
<!-- ================================================= -->

<script src="{{ url_for('static', filename='js/script.js') }}">
</script>


</body>

</html>
