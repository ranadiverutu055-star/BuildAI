<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BuildAI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

<div class="login-wrapper">

    <!-- LEFT SIDE -->
    <div class="login-visual">
    </div>


    <!-- RIGHT SIDE -->
    <div class="login-form-section">

        <div class="login-card">

            <!-- LOGO -->
            <div class="text-center login-header">

                <div class="login-logo">
                    <i class="fa-solid fa-city"></i>
                </div>

                <h2>
                    Build<span>AI</span>
                </h2>

                <p>
                    Construction Cost Prediction System
                </p>

            </div>


            <!-- WELCOME -->
            <div class="welcome-section">

                <h3>
                    Welcome Back!
                </h3>

                <p>
                    Login to continue to your dashboard.
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <div class="custom-input">

                        <i class="fa-solid fa-envelope"></i>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="Enter your email"
                               required>

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="custom-input password-input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="Enter your password"
                               required>

                        <button type="button"
                                id="togglePassword"
                                class="password-toggle">

                            <i class="fa-solid fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->
                <div class="login-options">

                    <div class="remember-me">

                        <input type="checkbox"
                               id="rememberMe">

                        <label for="rememberMe">
                            Remember Me
                        </label>

                    </div>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                </div>


                <!-- MESSAGE -->
                <div id="loginMessage"
                     style="display:none; margin-bottom:15px;">
                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit"
                        class="login-button"
                        id="loginButton">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login

                </button>

            </form>


            <!-- CREATE ACCOUNT LINK -->
            <div class="register-section">

                <p>

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Create an account
                    </a>

                </p>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="login-footer">

            <span>© 2026 BuildAI</span>

            <span>•</span>

            <span>
                Building the future with AI
            </span>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


<!-- LOGIN JAVASCRIPT -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const loginMessage =
        document.getElementById("loginMessage");


    /* ============================
       SHOW / HIDE PASSWORD
       ============================ */

    const togglePassword =
        document.getElementById("togglePassword");

    const passwordInput =
        document.getElementById("password");


    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            this.innerHTML =
                '<i class="fa-solid fa-eye-slash"></i>';

        } else {

            passwordInput.type = "password";

            this.innerHTML =
                '<i class="fa-solid fa-eye"></i>';

        }

    });


    /* ============================
       LOGIN
       ============================ */

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();


        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        if (!email || !password) {

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


        try {

            const response = await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({

                    email: email,
                    password: password

                })

            });


            const data =
                await response.json();


            if (response.ok && data.success) {

                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href =
                        data.redirect || "/dashboard";

                }, 700);

            }

            else {

                showMessage(
                    data.error ||
                    data.message ||
                    "Invalid email or password.",
                    "error"
                );


                loginButton.disabled = false;

                loginButton.innerHTML =
                    '<i class="fa-solid fa-right-to-bracket"></i> Login';

            }

        }

        catch (error) {

            console.error("Login Error:", error);


            showMessage(
                "Unable to connect to the server. Please try again.",
                "error"
            );


            loginButton.disabled = false;

            loginButton.innerHTML =
                '<i class="fa-solid fa-right-to-bracket"></i> Login';

        }

    });


    /* ============================
       MESSAGE
       ============================ */

    function showMessage(message, type) {

        loginMessage.style.display = "block";

        loginMessage.textContent = message;

        loginMessage.style.padding = "10px 14px";

        loginMessage.style.borderRadius = "8px";


        if (type === "success") {

            loginMessage.style.color = "#198754";

            loginMessage.style.background = "#e9f7ef";

        }

        else {

            loginMessage.style.color = "#dc3545";

            loginMessage.style.background = "#fdecec";

        }

    }

});

</script>


<!-- EXISTING SCRIPT -->
<script src="{{ url_for('static', filename='js/script.js') }}">
</script>

</body>
</html>
